<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5c3d">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Página pública de una tienda: lo que vende, precios y reservas. Se abre con el QR de la tienda. */
:root{
  --bg:#f4f6f1; --surface:#fff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#fff; --accent:#e0a526;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{padding:24px 0 8px}
h1{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.block{width:100%} .btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px} .field label{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.price{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.stepper span{min-width:3.4ch;text-align:center;font-weight:700;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.bar .btn{max-width:608px;margin:0 auto;display:flex}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.trap{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.err{color:var(--bad);font-size:14px;font-weight:600}
.empty{padding:20px 0;text-align:center;color:var(--muted)}
.skeleton{height:18px;border-radius:6px;background:var(--surface-2);margin:10px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><header><div class="skeleton" style="width:60%;height:30px"></div><div class="skeleton" style="width:80%"></div></header></div>
<div class="bar" id="bar" hidden><button class="btn primary block" id="go"></button></div>
<div id="modal"></div>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const fq = (p, q) => (+q).toLocaleString("es-CL", { maximumFractionDigits:1 }) + (p.kg ? " kg" : "");
const ymd = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const diaTxt = f => { const n = Math.round((new Date(f + "T12:00") - new Date(ymd() + "T12:00")) / 864e5);
  return n === 0 ? "hoy" : n === 1 ? "mañana" : n === -1 ? "ayer" : new Date(f + "T12:00").toLocaleDateString("es-CL", { weekday:"long", day:"numeric" }); };
const ago = t => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? "recién" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`; };
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

const q = new URLSearchParams(location.search);
const PID = (q.get("t") || "").toLowerCase(), BASE = (q.get("s") || location.origin).replace(/\/+$/, "");
const API = path => `${BASE}/api/publico/${encodeURIComponent(PID)}${path}`;
const t0 = Date.now();
let T = null;                                   // la vitrina de la tienda
const ui = { f:"Todos", q:"", cart:{}, sending:false };
const MIAS = "reservas:" + PID;

async function api(path, opts){
  const r = await fetch(API(path), Object.assign({ cache:"no-store" }, opts));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || "No se pudo conectar con la tienda"), { status:r.status });
  return j;
}

async function load(){
  if (!/^[a-z0-9]{10,24}$/.test(PID)) return fail("Este link está incompleto. Vuelve a escanear el código QR de la tienda.");
  try { T = await api(""); }
  catch(e){ return fail(e.status === 404 ? e.message : "No se pudo conectar con la tienda. Puede que su computador esté apagado o sin internet. Intenta de nuevo en un rato.", true); }
  document.title = T.nombre || "Tienda";
  if (T.color && /^#[0-9a-f]{6}$/i.test(T.color) && !matchMedia("(prefers-color-scheme: dark)").matches){ document.documentElement.style.setProperty("--brand", T.color); $('meta[name="theme-color"]').content = T.color; }
  render(); misReservas();
}
function fail(msg, retry){
  $("#app").innerHTML = `<header><h1>Tienda</h1></header><div class="card stack"><p>${esc(msg)}</p>${retry ? `<button class="btn" id="retry">Intentar de nuevo</button>` : ""}</div>`;
  const b = $("#retry"); if (b) b.onclick = () => location.reload();
}

const prods = () => T.productos || [];
const P = id => prods().find(p => p.id === id);
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim();
const STOCK = { hay:["ok","Hay"], poco:["warn","Quedan pocos"], no:["bad","Agotado"] };
const reservable = p => T.reservas && p.r && p.s !== "no";

function render(){
  const secs = [...new Set(prods().map(p => p.c))];
  if (!secs.includes(ui.f)) ui.f = "Todos";
  const w = norm(ui.q).split(" ").filter(Boolean);
  const list = prods().filter(p => (ui.f === "Todos" || p.c === ui.f) && w.every(x => norm(p.n).includes(x)));
  const by = {}; list.forEach(p => (by[p.c] ||= []).push(p));
  const wa = T.whatsapp ? `https://wa.me/${T.whatsapp}?text=${encodeURIComponent("Hola " + (T.nombre || "") + ", ")}` : "";
  const hayRes = T.reservas && prods().some(p => p.r);
  $("#app").innerHTML = `<header class="stack" style="gap:8px">
      <h1>${esc(T.nombre || "Tienda")}</h1>
      ${T.mensaje ? `<p>${esc(T.mensaje)}</p>` : ""}
      ${T.direccion || T.horario ? `<p class="small muted">${[T.direccion, T.horario].filter(Boolean).map(esc).join(" · ")}</p>` : ""}
      ${wa ? `<div><a class="btn sm" href="${esc(wa)}" target="_blank" rel="noopener">Escribir por WhatsApp</a></div>` : ""}
    </header>
    <div class="stack">
      <div id="mias"></div>
      ${hayRes ? `<p class="small muted">Elige lo que quieres reservar con los botones + y la tienda te confirma.</p>` : ""}
      <input class="input" id="q" type="search" placeholder="Buscar producto" value="${esc(ui.q)}" autocomplete="off">
      ${secs.length > 1 ? `<div class="chips">${["Todos", ...secs].map(c => `<button class="chip" data-f="${esc(c)}" aria-pressed="${ui.f === c}">${esc(c)}</button>`).join("")}</div>` : ""}
      <div id="lista">${Object.keys(by).length ? Object.entries(by).map(([c, ps]) => `<div class="card" style="padding-block:4px;margin-bottom:12px"><h3 style="padding-top:12px">${esc(c)}</h3><div class="list">${ps.map(row).join("")}</div></div>`).join("")
        : `<div class="empty">${prods().length ? "No encontramos ese producto." : "La tienda todavía no publica sus productos."}</div>`}</div>
      <p class="small muted">Precios y disponibilidad informados por la tienda${T.publicado ? `, actualizados ${ago(T.publicado)}` : ""}. Pueden cambiar.</p>
    </div>`;
  $("#q").oninput = e => { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#q"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.f = b.dataset.f; render(); });
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => step(b.dataset.inc, 1));
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => step(b.dataset.dec, -1));
  bar(); pintarMias();
}
function row(p){
  const st = T.stock && STOCK[p.s], n = ui.cart[p.id] || 0;
  return `<div class="item"><div class="main"><div class="name">${esc(p.n)}</div>
      <div class="sub"><span class="price" style="color:var(--fg)">${p.p > 0 ? clp(p.p) : "Consultar"}</span>${p.kg && p.p > 0 ? " el kilo" : ""}${st ? ` · <span class="pill ${st[0]}">${st[1]}</span>` : ""}</div></div>
    ${reservable(p) ? `<div class="stepper">${n > 0 ? `<button data-dec="${p.id}" aria-label="Quitar ${esc(p.n)}">−</button><span>${fq(p, n)}</span>` : ""}<button data-inc="${p.id}" aria-label="Reservar ${esc(p.n)}">+</button></div>` : ""}</div>`;
}
function step(id, d){
  const p = P(id); if (!p) return;
  const n = Math.max(0, Math.min(p.kg ? 5 : 30, (ui.cart[id] || 0) + d * (p.kg ? 0.5 : 1)));
  if (n) ui.cart[id] = n; else delete ui.cart[id];
  const y = scrollY; render(); scrollTo(0, y);
}
const detalle = () => Object.entries(ui.cart).map(([id, n]) => `${fq(P(id), n)} ${P(id).n.toLowerCase()}`).join(", ");
const total = () => Object.entries(ui.cart).reduce((a, [id, n]) => a + n * (P(id).p || 0), 0);
function bar(){
  const n = Object.keys(ui.cart).length;
  $("#bar").hidden = !n; $(".wrap").style.paddingBottom = n ? "120px" : "";
  if (n){ $("#go").textContent = `Reservar ${n === 1 ? "1 producto" : n + " productos"}${total() ? " · " + clp(total()) : ""}`; $("#go").onclick = formulario; }
}

// Formulario de la reserva
function formulario(){
  const yo = store.get("yo", {}), dias = Math.max(0, Math.min(7, +T.diasMax || 0));
  const fechas = Array.from({ length:dias + 1 }, (_, i) => ymd(Date.now() + i * 864e5));
  let para = fechas[0];
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="rt">
    <div class="spread"><h2 id="rt">Tu reserva</h2><button class="btn sm" data-close>Cerrar</button></div>
    <div class="card"><p style="font-weight:600">${esc(detalle())}</p>${total() ? `<p class="small muted">Aprox. ${clp(total())}. Pagas al retirar.</p>` : ""}</div>
    <div class="field"><label for="fn">Tu nombre</label><input class="input" id="fn" autocomplete="name" maxlength="40" value="${esc(yo.nombre || "")}"></div>
    <div class="field"><label for="ft">Tu celular</label><input class="input" id="ft" type="tel" inputmode="tel" autocomplete="tel" placeholder="9 1234 5678" value="${esc(yo.tel || "")}"></div>
    ${fechas.length > 1 ? `<div class="field"><label>¿Para cuándo?</label><div class="chips">${fechas.map(f => `<button class="chip" data-para="${f}" aria-pressed="${f === para}">${esc(diaTxt(f).replace(/^./, c => c.toUpperCase()))}</button>`).join("")}</div></div>` : ""}
    <div class="field"><label for="fh">¿A qué hora pasas? (opcional)</label><input class="input" id="fh" maxlength="20" placeholder="Ej: a las 8 de la mañana"></div>
    <div class="field"><label for="fx">Nota para la tienda (opcional)</label><input class="input" id="fx" maxlength="140" placeholder="Ej: la hallulla bien cocida"></div>
    <div class="trap" aria-hidden="true"><label for="fw">No llenar</label><input id="fw" tabindex="-1" autocomplete="off"></div>
    <p class="err" id="ferr" hidden></p>
    <button class="btn primary block" id="fsend">Enviar reserva</button>
    <p class="small muted">La tienda recibe tu nombre y celular solo para confirmar la reserva.</p>
  </div></div>`;
  const close = () => { $("#modal").innerHTML = ""; };
  $("#ov").onclick = e => { if (e.target.id === "ov" || e.target.hasAttribute("data-close")) close(); };
  document.querySelectorAll("[data-para]").forEach(b => b.onclick = () => { para = b.dataset.para; document.querySelectorAll("[data-para]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  const err = m => { $("#ferr").textContent = m; $("#ferr").hidden = false; };
  $("#fsend").onclick = async () => {
    if (ui.sending) return;
    const nombre = $("#fn").value.trim(), tel = $("#ft").value.trim();
    if (nombre.length < 2) return err("Escribe tu nombre."), $("#fn").focus();
    if (tel.replace(/\D/g, "").length < 8) return err("Escribe tu celular."), $("#ft").focus();
    ui.sending = true; $("#fsend").disabled = true; $("#fsend").textContent = "Enviando…";
    try {
      const r = await api("/reserva", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({
        nombre, telefono:tel, para, hora:$("#fh").value.trim(), nota:$("#fx").value.trim(), web:$("#fw").value, ms:Date.now() - t0,
        items:Object.entries(ui.cart).map(([id, q]) => ({ id, q })) }) });
      store.set("yo", { nombre, tel });
      store.set(MIAS, [{ id:r.id, k:r.k, detail:r.detail, para, at:Date.now(), estado:"nueva" }, ...store.get(MIAS, [])].slice(0, 5));
      ui.cart = {}; close(); render(); misReservas(); scrollTo(0, 0);
    } catch(e){ err(e.message); }
    finally { ui.sending = false; const b = $("#fsend"); if (b){ b.disabled = false; b.textContent = "Enviar reserva"; } }
  };
}

// Las reservas que hizo este celular, con lo que dice la tienda
const ESTADO = { nueva:["warn","Esperando que la tienda la confirme"], confirmada:["ok","Confirmada"], rechazada:["bad","La tienda no la puede atender"], entregada:["ok","Retirada"], cerrada:["ok","Cerrada"] };
function pintarMias(){
  const el = $("#mias"); if (!el) return;
  const ms = store.get(MIAS, []).filter(m => m.para >= ymd(Date.now() - 864e5));
  el.innerHTML = ms.length ? `<div class="card stack" style="gap:8px"><h3>Tus reservas</h3><div class="list">${ms.map(m => { const e = ESTADO[m.estado] || ESTADO.nueva;
    return `<div class="item"><div class="main"><div class="name">${esc(m.detail)}</div><div class="sub">Para ${esc(diaTxt(m.para))}</div></div><span class="pill ${e[0]}" style="white-space:normal;text-align:right;max-width:46%">${e[1]}</span></div>`; }).join("")}</div></div>` : "";
}
let timer = null;
async function misReservas(){
  clearTimeout(timer);
  const ms = store.get(MIAS, []);
  const vivas = ms.filter(m => m.para >= ymd() && !["entregada","rechazada","cerrada"].includes(m.estado));
  for (const m of vivas){ try { const r = await api(`/reserva/${encodeURIComponent(m.id)}?k=${encodeURIComponent(m.k)}`); m.estado = r.estado; } catch(e){} }
  store.set(MIAS, ms); pintarMias();
  if (vivas.length) timer = setTimeout(misReservas, 20e3);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && T) misReservas(); });

load();
})();
</script>
</body>
</html>
