<style>
/* Layout: app de una columna para celular, barra de navegación fija abajo, tarjetas solo donde separan cosas distintas */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526; --accent-soft:#fbefd2;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --r2:10px; --rp:99px; --shadow:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brandname{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brandname small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.demo-banner{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:10px 14px;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#1d1606;border-color:var(--accent)}
.btn.ghost{background:transparent}

.btn.block{width:100%}
.panbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent);color:#1d1606}
.panbtn svg{width:34px;height:34px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panbtn b{display:block;font-size:16px}
.panbtn small{display:block;font-size:13px;opacity:.8}
.mi svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea.input{resize:vertical}
a.btn{color:inherit;text-decoration:none;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
.livebox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.livebox video{width:100%;height:100%;object-fit:cover;display:block}
.liveline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livemsg{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;color:#fff;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.filebtn{position:relative;display:block;text-align:center;overflow:hidden}

.list{display:flex;flex-direction:column}

.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--rp);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:6px 12px;font-size:13px;white-space:nowrap}

.sector .name{font-weight:700;font-size:16px}
.sector .sub{font-size:13px;color:var(--muted);grid-column:1/-1}
.formula{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:var(--r2);padding:10px 12px}
.countrow{display:grid;grid-template-columns:1fr 84px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.countrow .input{text-align:center;font-weight:700;font-size:17px;padding:8px}

.cartline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper span{min-width:2.2ch;text-align:center;font-weight:700}
.total{font-family:var(--font-display);font-weight:800;font-size:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--tabs,6),1fr)}

nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.overlay{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r2);font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

.diff{font-size:13px;font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

.swatch i{display:flex;width:40px;height:22px;border-radius:var(--rp);overflow:hidden}
.swatch i b{flex:1}
.swatch[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{padding:10px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-fg)}
.ext{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ext:last-child{border-bottom:0}
.ext .sub{grid-column:1/2;font-size:13px;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;flex:none;grid-row:1/3;grid-column:2}

.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--brand)}

.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#000;background:#fff;padding:0;margin:0}}
.hdr-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r2);padding:12px;margin:0}
.ext-g{margin:12px 0 0}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.quick button{padding:10px 8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);font-weight:700;font-size:14px;line-height:1.2}
.quick button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tour-hole{position:fixed;border-radius:var(--r2);box-shadow:0 0 0 9999px rgba(10,16,12,.62);z-index:40;pointer-events:none;transition:all .2s}
.tour-card{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:var(--r);padding:16px;z-index:41;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.barra{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.barra i{display:block;height:10px;background:var(--brand);border-radius:var(--rp);min-width:2px}
.hint{background:var(--accent-soft);border-radius:var(--r2);padding:8px 10px;font-size:13px;font-weight:600}
:root[data-fuente="redondeada"]{--font-display:"Nunito","Figtree",system-ui,sans-serif;--font-body:"Nunito","Figtree",system-ui,sans-serif}

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

<script src="catalogos.js"></script>

<script>
(function(){
"use strict";
const H = 3600e3, D = 24*H;
// Las reservas son del día: se borran solas a las 3 de la mañana
const RES_CUT_HOUR = 3;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const uid = () => LocalDB.uuid();

// Orden en que se muestran los sectores; los que no están en la lista van al final
const ORDEN_SECTORES = ["Pan","Pastelería","Fiambrería","Verduras","Frutas","Vacuno","Cerdo","Pollo","Embutidos","Parrilla","Bebidas","Cervezas","Vinos","Licores",
  "Jugos","Lácteos","Abarrotes","Legumbres","Galletas","Conservas","Snacks","Dulces","Helados","Aseo","Mascotas","Otros"];
// Sectores que tienen productos en esta tienda
function sectores(){ const set = new Set(S.products.map(p => p.cat)); return [...ORDEN_SECTORES.filter(c => set.has(c)), ...[...set].filter(c => !ORDEN_SECTORES.includes(c)).sort((a, b) => a.localeCompare(b, "es"))]; }
// Un producto se vende si la tienda lo tiene y su sector no está apagado
const sectorOff = c => (S.ajustes.sectores_off || []).includes(c);
const disp = p => p.has && !sectorOff(p.cat);

// Tipos de negocio: qué productos trae al empezar y qué extensiones vienen prendidas.
// catalogo: "generico" (con precios de referencia) o un catálogo de catalogos.js, opcionalmente filtrado por sectores
const NEGOCIOS = {
  almacen:   { nombre:"Almacén", desc:"Abarrotes, bebidas, lácteos, aseo, pan y verduras", catalogo:[["generico"], ["emporio"]], ext:["contar","recibir","compras","fiados","pan","granel","caja"] },
  minimarket:{ nombre:"Minimarket", desc:"Como un almacén, con más control de caja, ofertas y equipo", catalogo:[["generico"], ["emporio"]], ext:["contar","recibir","compras","vencimientos","proveedores","granel","caja","ofertas","comprobante","personas","fiados"] },
  panaderia: { nombre:"Panadería", desc:"Pan por kilo o por unidad, pastelería y fiambrería", catalogo:[["panaderia"]], ext:["contar","recibir","compras","pan","granel","caja","comprobante","encargos"] },
  carniceria:{ nombre:"Carnicería", desc:"Vacuno, cerdo, pollo y embutidos por kilo", catalogo:[["carniceria"]], ext:["contar","recibir","compras","proveedores","vencimientos","granel","caja","comprobante","encargos"] },
  verduleria:{ nombre:"Verdulería", desc:"Frutas y verduras por kilo", catalogo:[["verduleria"]], ext:["recibir","compras","proveedores","granel","caja","fiados"] },
  botilleria:{ nombre:"Botillería", desc:"Bebidas, cervezas, vinos, licores y snacks", catalogo:[["emporio", ["Bebidas","Jugos","Snacks","Dulces","Helados"]], ["botilleria"]], ext:["contar","recibir","compras","proveedores","caja","ofertas","comprobante","personas"] },
  otro:      { nombre:"Otro negocio", desc:"Empiezas sin productos y eliges qué usar", catalogo:[], ext:["contar","recibir","compras"] }
};
const ATAJOS_PAN = ["Marraqueta","Hallulla","Pan amasado"];
const nuevoProd = (name, cat, kg) => Object.assign({ id:uid(), name, cat, price:0, cost:0, barcode:"", min:kg ? 2 : 3, has:true, countQty:null, countAt:null, estimated:false },
  kg ? { kg:true } : {}, cat === "Pan" && ATAJOS_PAN.includes(name) ? { atajo:true } : {});
// Productos de un tipo de negocio, sin repetir nombres (ni los que ya están en `ya`)
function catalogoNegocio(tipo, ya = []){
  const out = [], seen = new Set(ya.map(p => norm(p.name)));
  const add = p => { const k = norm(p.name); if (seen.has(k)) return; seen.add(k); out.push(p); };
  for (const [src, secs] of (NEGOCIOS[tipo] || NEGOCIOS.otro).catalogo){
    if (src === "generico") buildSeed().products.forEach(p => { delete p.pop; delete p.prov; add(Object.assign(p, { countQty:null, countAt:null, has:true, barcode:"", estimated:false })); });
    else (window.CATALOGOS?.[src] || []).filter(c => !secs || secs.includes(c[1])).forEach(([name, cat, kg]) => add(nuevoProd(name, cat, kg)));
  }
  return out;
}
const cuantosCatalogo = tipo => { const ps = catalogoNegocio(tipo); return { n:ps.length, sec:new Set(ps.map(p => p.cat)).size }; };

// Catálogo precargado típico de almacén: [nombre, sector, precio venta, costo, popularidad 0-3, extras]
// El pan y las verduras van por kilo (precio por kilo); cada tipo de pan se puede cambiar a "por unidad" en Tipos de pan
const KG = { kg:true }, PAN = { kg:true, atajo:true };
const CATALOG = [
 ["Marraqueta","Pan",2190,1450,3,PAN],["Hallulla","Pan",2190,1450,3,PAN],["Pan amasado","Pan",2490,1650,2,PAN],

// Generador pseudoaleatorio con semilla, para que la demo siempre arranque igual
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

function atDay(daysAgo, hour, min){ const d = new Date(Date.now() - daysAgo*D); d.setHours(hour, min||0, 0, 0); return d.getTime(); }

function buildSeed(){
  const r = rng(42);
  const codes = { "Coca-Cola 1,5 L":"7800000000011", "Coca-Cola 3 L":"7800000000028", "Coca-Cola Zero 1,5 L":"7800000000035" };
  const products = CATALOG.map(c => Object.assign({ id:uid(), name:c[0], cat:c[1], price:c[2], cost:c[3], pop:c[4],
    barcode: codes[c[0]] || "", min: c[5]?.kg ? (c[4] >= 2 ? 5 : 2) : c[4] >= 2 ? 6 : 3,
    has:true, countQty:null, countAt:null, estimated:false }, c[5] || {}));
  const byName = n => products.find(p => p.name === n);
  byName("Agua mineral con gas 1,6 L").has = false;
  byName("Arvejas partidas 500 g").has = false;
  const movs = [];
  const now = Date.now();
  // Ventas de los últimos 5 días (incluido hoy hasta la hora actual)
  for (let d = 5; d >= 0; d--){
    for (const p of products){
      if (!p.has) continue;
      const n = [0.15, 0.6, 1.6, 3.2][p.pop];
      let k = Math.floor(n + r()*n);
      while (k-- > 0){
        const t = atDay(d, 9 + Math.floor(r()*12), Math.floor(r()*60));
        if (t > now - 5*60e3) continue;
        movs.push({ id:uid(), pid:p.id, type:"venta", qty: p.kg ? r3(0.25 + Math.round(r()*5)/4) : r() < 0.2 ? 2 : 1, at:t, price:p.price });
      }
    }
  }
  // Conteos ya hechos: Bebidas hace 3 días, Lácteos hace 2, Galletas ayer (al cierre)
  const counts = { "Bebidas":[3,20,30], "Lácteos":[2,20,15], "Galletas":[1,20,40] };
  const qtys = { "Coca-Cola 1,5 L":30,"Coca-Cola 3 L":12,"Coca-Cola Zero 1,5 L":9,"Sprite 1,5 L":3,"Fanta 1,5 L":2,"Pepsi 1,5 L":6,"Bilz 1,5 L":7,"Pap 1,5 L":6,"Agua mineral sin gas 1,6 L":18,
    "Leche entera 1 L":16,"Leche descremada 1 L":6,"Yogur batido 125 g":14,"Mantequilla 250 g":5,"Queso laminado 250 g":4,
    "Galletas de agua":15,"Galletas de soda":13,"Galletas rellenas chocolate":22,"Galletas rellenas vainilla":16,"Galletas de vino":8 };
  for (const [cat,[d,h,m]] of Object.entries(counts)){
    const t = atDay(d,h,m);
    for (const p of products.filter(p => p.cat === cat && p.has)){
      p.countQty = qtys[p.name] ?? 6; p.countAt = t;
      movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:t });
    }
  }
  // Una compra al proveedor después del conteo de Bebidas
  const coca = byName("Coca-Cola 1,5 L");
  movs.push({ id:uid(), pid:coca.id, type:"compra", qty:24, at:atDay(2,11,15), cost:1300, supplier:"Distribuidora Ejemplo" });
  const agua = byName("Agua mineral sin gas 1,6 L");
  movs.push({ id:uid(), pid:agua.id, type:"compra", qty:12, at:atDay(2,11,15), cost:560, supplier:"Distribuidora Ejemplo" });
  movs.sort((a,b) => a.at - b.at);
  // Si alguna venta deja un producto contado en negativo, se elimina (la demo debe ser coherente)
  for (const p of products){
    if (p.countAt == null) continue;
    let s = p.countQty;
    for (const m of movs.filter(m => m.pid === p.id && m.at > p.countAt)){
      if (m.type === "compra") s += m.qty;
      if (m.type === "venta"){ if (s - m.qty < 1 && p.pop < 3){ m.drop = true; } else s -= m.qty; }
    }
  }
  return Object.assign({ products, movs: movs.filter(m => !m.drop), seededAt: now }, seedExtras(), seedExtensiones(byName));
}

const ops = (store, list) => list.map(value => ({ store, value }));

async function loadLocal(){
  const t = await LocalDB.loadAll();
  meta.tienda = t.meta.tienda || null; meta.device = t.meta.device || null; meta.demo = !!t.meta.demo; meta.pending = t.pending; meta.servidor = t.meta.servidor || ""; meta.prefs = t.meta.prefs || null; meta.cuenta = t.meta.cuenta || null;
  if (meta.device) LocalDB.clock.device = meta.device.id;
  const aj = Object.fromEntries(t.ajustes.map(a => [a.clave, a.valor]));
  const clients = t.clients.map(c => ({ id:c.id, name:c.name, phone:c.phone || "", items:[] })), byId = Object.fromEntries(clients.map(c => [c.id, c]));
  t.fiados.sort((a, b) => a.at - b.at).forEach(f => byId[f.cid]?.items.push(Object.assign({ id:f.id, type:f.type, amount:f.amount, note:f.note, at:f.at }, f.quien ? { quien:f.quien } : {})));
  const strip = o => { const { _v, ...rest } = o; return rest; };
  S = { products: t.products.map(strip).sort((a, b) => a.name.localeCompare(b.name, "es")), movs: t.movs.map(strip).sort((a, b) => a.at - b.at),
    clients, reservas: t.reservas.map(strip), panMsg: aj.mensaje_pan ?? "", ajustes: aj };
  for (const k of EXT_TABLAS) S[k] = (t[k] || []).map(strip);
  meta.persona = t.meta.persona || "";
}
const EXT_TABLAS = ["vencimientos","cajas","proveedores","provmovs","ofertas","personas","encargos"];
// Guarda en la base local y actualiza el contador de cambios por enviar
async function commit(list){ await LocalDB.apply(list); meta.pending = await LocalDB.pendingCount(); Sync.syncSoon(); }

// Crea la tienda en este dispositivo. inicio: "catalogo" | "vacio" | "ejemplo"
async function createStore(nombre, persona, inicio, extensiones, tipo){
  const device = newDevice();
  const tienda = { id: uid(), nombre, persona, creada: Date.now() };
  let data;
  if (inicio === "ejemplo") data = buildSeed();
  else data = { products: inicio === "catalogo" ? catalogoNegocio(tipo || "almacen") : [], movs:[], clients:[], reservas:[],
    panMsg: "🍞 ¡Llegó el pan calentito! Los esperamos en " + nombre + "." };
  data.products.forEach(p => { delete p.pop; if (inicio !== "ejemplo") delete p.prov; });
  // Los datos de ejemplo quedan solo en este dispositivo: no se envían al servidor
  const local = inicio === "ejemplo";
  const list = [...ops("products", data.products), ...ops("movs", data.movs), ...ops("clients", data.clients.map(clientRow)),
    ...data.clients.flatMap(c => ops("fiados", c.items.map(i => fiadoRow(c, i)))), ...ops("reservas", data.reservas),
    ...EXT_TABLAS.flatMap(k => ops(k, data[k] || [])),
    { store:"ajustes", value:{ clave:"tienda_nombre", valor:nombre } }, { store:"ajustes", value:{ clave:"mensaje_pan", valor:data.panMsg } }];
  if (extensiones) list.push({ store:"ajustes", value:{ clave:"extensiones", valor:extensiones } });
  if (tipo) list.push({ store:"ajustes", value:{ clave:"tipo_negocio", valor:tipo } });
  list.forEach(o => o.local = local);
  await LocalDB.wipe();
  LocalDB.clock.device = device.id;
  await LocalDB.setMeta("device", device);
  await LocalDB.setMeta("tienda", tienda);
  await LocalDB.setMeta("demo", local);
  if (!local && meta.servidor) await LocalDB.setMeta("servidor", meta.servidor);
  await commit(list);
  await LocalDB.persist();
}
const newDevice = () => ({ id: uid().replace(/-/g, "").slice(0, 8), nombre: /Android|iPhone|iPad/i.test(navigator.userAgent) ? "Celular" : "Computador", creado: Date.now() });

// Une este dispositivo a una tienda que ya existe en el servidor y descarga todos sus datos
async function joinStore(servidor, tiendaId, cuenta){
  if (!(await Sync.probe(servidor))) throw new Error("No se encontró el servidor en " + servidor);
  const device = newDevice();
  await LocalDB.wipe();
  LocalDB.clock.device = device.id;
  await LocalDB.setMeta("device", device);
  await LocalDB.setMeta("servidor", servidor);
  await LocalDB.setMeta("demo", false);
  if (cuenta) await LocalDB.setMeta("cuenta", cuenta);
  Sync.state.token = cuenta?.token || "";
  Sync.start(servidor, tiendaId);
  await Sync.syncNow();
  if (Sync.state.status === "cuenta") throw Object.assign(new Error(Sync.state.error), { code:"cuenta" });
  if (Sync.state.status === "error") throw new Error(Sync.state.error);
  await loadLocal();
  if (!S.ajustes.tienda_nombre && !S.products.length) throw new Error("El servidor no tiene datos de esa tienda. Revisa el código.");
  await LocalDB.setMeta("tienda", { id:tiendaId, nombre:S.ajustes.tienda_nombre || "Tienda", persona:"", unida:Date.now() });
  await LocalDB.persist();
}

function stockOf(p){
  if (p.countAt == null) return null;
  let s = p.countQty;
  for (const m of S.movs){ if (m.pid !== p.id || m.at <= p.countAt) continue;
    if (m.type === "compra") s += m.qty; else if (m.type === "venta") s -= m.qty; }
  return r3(s);
}
function pendingSales(p){ return S.movs.filter(m => m.pid === p.id && m.type === "venta").reduce((a,m)=>a+m.qty,0); }
function ago(t){
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const hm = new Date(t).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  if (t >= d0.getTime()) return "hoy " + hm;
  if (t >= d0.getTime() - D) return "ayer " + hm;
  if (t >= d0.getTime() - 6*D) return new Date(t).toLocaleDateString("es-CL",{weekday:"long"}) + " " + hm;
  return new Date(t).toLocaleDateString("es-CL",{day:"numeric",month:"short"}) + " " + hm;
}
function stockPill(p){
  if (!p.has) return '<span class="pill none">No lo tenemos</span>';
  if (sectorOff(p.cat)) return '<span class="pill none">Sector apagado</span>';
  const s = stockOf(p);
  if (s == null) return '<span class="pill none">Sin contar</span>';
  const est = p.estimated ? " aprox." : "";
  if (s <= 0) return `<span class="pill bad">Agotado</span>`;
  if (s <= p.min) return `<span class="pill warn">Quedan ${fq(p, s)}${est}</span>`;
  return `<span class="pill ok">${fq(p, s)}${est} en stock</span>`;
}
function toast(msg){ document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function friendly(e){
  const m = (e && e.message) || String(e || "");
  if (e?.name === "QuotaExceededError") return "El dispositivo se quedó sin espacio. Libera espacio y vuelve a intentar.";
  return m || "Algo salió mal";
}
let busy = false;
async function run(fn){ if (busy) return; busy = true; try { return await fn(); } catch(e){ console.error(e); toast(friendly(e)); } finally { busy = false; } }

const ui = { view:"inicio", cart:[], recv:{ supplier:"", items:[], debe:false }, sector:null, draft:{}, prodFilter:"Todos", prodQuery:"", histFilter:"todos", histWho:"",

// ---------- Acciones: cada cambio pasa por aquí y queda guardado en el dispositivo ----------
const act = {
  // Cada línea guarda el precio que se cobró de verdad (con la oferta ya descontada)
  async sale(cart, pago){
    const now = LocalDB.now(), grupo = uid(), pr = pricing(cart);
    const movs = pr.lines.map(l => { const m = withWho({ id:uid(), pid:l.pid, type:"venta", qty:l.qty, at:now, price:(l.bruto - l.desc) / l.qty, lista:l.unit, grupo });
      if (l.desc) m.desc = l.desc; if (pago) m.pago = pago; return m; });
    await commit(ops("movs", movs)); S.movs.push(...movs);
    return { grupo, total:pr.total };
  },
  // opts.debe: la factura queda como deuda con el proveedor
  async receive(supplier, items, opts = {}){
    items = items.filter(l => l.qty > 0);
    const now = LocalDB.now(), grupo = uid(), extra = [];
    supplier = (supplier || "").trim();
    let prov = null;
    if (ext("proveedores") && supplier){
      prov = S.proveedores.find(x => x.nombre.trim().toLowerCase() === supplier.toLowerCase());
      if (!prov){ prov = { id:uid(), nombre:supplier, telefono:"", dias:[], nota:"" }; extra.push(["proveedores", prov]); }
    }
    const movs = items.map(l => withWho(Object.assign({ id:uid(), pid:l.pid, type:"compra", qty:l.qty, at:now, cost:l.cost, supplier, grupo }, ext("vencimientos") && l.vence ? { vence:l.vence } : {})));
    // El costo se actualiza con lo que se pagó; si se recibió por caja, queda guardado cuántas trae
    const prods = items.map(l => Object.assign({}, P(l.pid), l.cost > 0 ? { cost:l.cost } : {}, { has:true }, prov && !P(l.pid).prov ? { prov:prov.id } : {}, l.caja?.por ? { porCaja:l.caja.por } : {}));
    if (ext("vencimientos")) items.filter(l => l.vence).forEach(l => extra.push(["vencimientos", { id:uid(), pid:l.pid, fecha:l.vence, qty:l.qty, done:false, at:now }]));
    const total = Math.round(items.reduce((a, l) => a + l.qty * l.cost, 0));
    if (prov && opts.debe && total > 0) extra.push(["provmovs", { id:uid(), prov:prov.id, type:"factura", amount:total, note:"Mercadería recibida", at:now }]);
    await commit([...ops("products", prods), ...ops("movs", movs), ...extra.map(([store, value]) => ({ store, value }))]);
    prods.forEach(p => Object.assign(P(p.id), p)); S.movs.push(...movs);
    extra.forEach(([store, v]) => upsert(store, [v]));
  },
  // draft: { pid: { qty, est, none } }. Devuelve cuántos se contaron y las diferencias
  async count(draft){
    const diffs = [], movs = [], prods = []; let n = 0;
    const now = LocalDB.now();
    for (const [pid, d] of Object.entries(draft)){
      const p = Object.assign({}, P(pid));
      if (d.none === true){ p.has = false; prods.push(p); continue; }
      if (d.none === false) p.has = true;
      if (d.qty === "" || d.qty == null){ if (d.none === false) prods.push(p); continue; }
      const c = p.kg ? r3(Math.max(0, num(d.qty))) : Math.max(0, Math.round(num(d.qty)));
      const expected = stockOf(P(pid));
      if (expected != null && expected !== c) diffs.push([P(pid), expected, c]);
      Object.assign(p, { countQty:c, countAt:now, estimated:!!d.est }); n++;
      prods.push(p); movs.push(withWho({ id:uid(), pid, type:"conteo", qty:c, expected, at:now }));
    }
    await commit([...ops("products", prods), ...ops("movs", movs)]);
    prods.forEach(p => Object.assign(P(p.id), p)); S.movs.push(...movs);
    return { n, diffs };
  },
  async updateProduct(p, f){
    const v = Object.assign({}, p, f);
    if (f.barcode && S.products.some(o => o.id !== p.id && o.barcode === f.barcode)) throw new Error("Ese código de barras ya está en otro producto");
    await commit(ops("products", [v])); return Object.assign(p, f);
  },
  async newProduct(f, qty){
    if (f.barcode && S.products.some(o => o.barcode === f.barcode)) throw new Error("Ese código de barras ya está en otro producto");
    const p = { id:uid(), name:f.name, cat:f.cat, price:f.price, cost:Math.round(f.price*0.65), barcode:f.barcode, min:3, has:true, countQty:null, countAt:null, estimated:false };
    if (f.kg) p.kg = true;
    const movs = [];
    if (qty !== ""){ p.countQty = p.kg ? r3(Math.max(0, num(qty))) : Math.max(0, Math.round(num(qty))); p.countAt = LocalDB.now(); movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:p.countAt }); }
    await commit([...ops("products", [p]), ...ops("movs", movs)]);
    S.products.push(p); S.movs.push(...movs); return p;
  },
  async newClient(name, phone){
    const c = { id:uid(), name, phone, items:[] };
    await commit(ops("clients", [clientRow(c)])); S.clients.push(c); return c;
  },
  async clientMov(c, type, amount, note){
    const i = withWho({ id:uid(), type, amount, note, at:LocalDB.now() });
    await commit(ops("fiados", [fiadoRow(c, i)])); c.items.push(i);
  },
  async setting(clave, valor){
    await commit([{ store:"ajustes", value:{ clave, valor } }]); S.ajustes[clave] = valor;
  },
  panMsg(text){
    S.panMsg = text;
    clearTimeout(act._pm); act._pm = setTimeout(() => act.setting("mensaje_pan", text).catch(e => toast(friendly(e))), 700);
  },
  async newReserva(name, detail){
    const r = { id:uid(), name, detail, at:LocalDB.now(), done:false };
    await commit(ops("reservas", [r])); S.reservas.push(r); return r;
  },
  async reserva(r, done){
    await commit(ops("reservas", [Object.assign({}, r, { done })])); r.done = done;
  },
  // Guardar o borrar registros de las tablas de las extensiones
  async put(store, rows){ await commit(ops(store, rows)); upsert(store, rows); return rows[0]; },
  async del(store, id){ await commit([{ store, del:id }]); S[store] = S[store].filter(x => x.id !== id); }
};

// ---------- Escaneo de códigos de barras ----------
async function decodeFile(file){
  if ("BarcodeDetector" in window){
    try { const bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] });
      const bmp = await createImageBitmap(file); const r = await bd.detect(bmp); if (r.length) return r[0].rawValue; } catch(e){}
  }
  if (!window.ZXing) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    return zxingDecode(img, img.width, img.height, 1400, true);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
const zxCanvas = document.createElement("canvas");
function zxingDecode(src, sw, sh, maxSide, hard){
  if (!window.ZXing || !sw || !sh) return null;
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw*scale), h = Math.round(sh*scale);
  zxCanvas.width = w; zxCanvas.height = h;
  const cx = zxCanvas.getContext("2d", { willReadFrequently:true }); cx.drawImage(src, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) lum[i] = (px[i*4]*299 + px[i*4+1]*587 + px[i*4+2]*114) / 1000;
  const hints = new Map(); if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const tryDecode = s => { try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s))).getText(); } catch(e){ return null; } };
  const lsrc = new ZXing.RGBLuminanceSource(lum, w, h);
  return tryDecode(lsrc) || (hard && lsrc.isRotateSupported && lsrc.isRotateSupported() ? tryDecode(lsrc.rotateCounterClockwise()) : null);
}

// Cámara en vivo: funciona cuando la página se abre como sitio propio (https). Dentro de un visor que bloquea la cámara, se usa la foto.
let live = null;
function stopLive(){ if (!live) return; live.stop = true; live.stream?.getTracks().forEach(t => t.stop()); live = null; }
async function startLive(cb){
  stopLive();
  const box = $("#liveBox"); if (!box) return;
  if (!navigator.mediaDevices?.getUserMedia){ box.hidden = true; return; }
  const me = live = { stop:false, stream:null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
    if (me.stop){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#liveVideo"); v.srcObject = stream; await v.play().catch(() => {});
    box.hidden = false; $("#liveMsg").textContent = "Apunta al código de barras";
    let bd = null;
    if ("BarcodeDetector" in window){ try { bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); } catch(e){} }
    const tick = async () => {
      if (me.stop) return;
      let code = null;
      try {
        if (v.readyState >= 2){
          if (bd){ const r = await bd.detect(v); if (r.length) code = r[0].rawValue; }
          else code = zxingDecode(v, v.videoWidth, v.videoHeight, 800, false);
        }
      } catch(e){}
      if (me.stop) return;
      if (code){ if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){} stopLive(); handleCode(code, cb); return; }
      setTimeout(tick, bd ? 150 : 250);
    };
    tick();
  } catch(e){
    if (live === me) live = null;
    box.hidden = true;
    const note = $("#liveNote"); if (note) note.hidden = false;
  }
}
async function handleFile(input, cb){
  const f = input.files && input.files[0]; if (!f) return;
  toast("Leyendo código…");
  const code = await decodeFile(f);
  if (!code){ openScanSheet(cb, "No se pudo leer el código en la foto. Intenta acercarte más, con buena luz y el código derecho, o escríbelo a mano."); return; }
  handleCode(code, cb);
}
function handleCode(code, cb){
  code = String(code).trim(); if (!code) return;
  const p = S.products.find(p => p.barcode === code);
  if (p){ closeModal(); cb(p); return; }
  openAssociate(code, cb);
}

// Búsqueda que no se fija en tildes, mayúsculas ni apóstrofes y aguanta una letra mal escrita.
// Primero lo que empieza igual, después lo que tiene todas las palabras y al final los "Parecidos".
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/['’`´]/g, "").replace(/\s+/g, " ").trim();
function casi(a, b){ // ¿a y b difieren en una letra como máximo?
  if (a === b) return true; const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < la && j < lb){ if (a[i] === b[j]){ i++; j++; continue; } if (++d > 1) return false; if (la > lb) i++; else if (lb > la) j++; else { i++; j++; } }
  return d + (la - i) + (lb - j) <= 1;
}
function buscar(q, list){
  const nq = norm(q), code = String(q).trim(); if (!nq) return { exactos:[], parecidos:[] };
  const words = nq.split(" "), a = [], b = [], c = [];
  for (const p of list){
    if (p.barcode && p.barcode === code){ a.unshift(p); continue; }
    const n = norm(p.name);
    if (n.startsWith(nq)) a.push(p);
    else if (words.every(w => n.includes(w))) b.push(p);
    else { const pw = n.split(/[ ,.\-()]+/);
      if (words.every(w => n.includes(w) || (w.length >= 3 && pw.some(x => casi(w, x) || (x.length > w.length && casi(w, x.slice(0, w.length))))))) c.push(p); }
  }
  return { exactos:[...a, ...b], parecidos:c };
}
function searchResults(q, onPick, opts){
  if (!q.trim()) return "";
  const r = buscar(q, S.products.filter(p => opts?.all || disp(p)));
  const row = p => `<button class="item tap" data-pick="${p.id}"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${p.price > 0 ? clp(p.price) + (p.kg ? " el kilo" : "") : "Sin precio"} · ${esc(p.cat)}</div></div>${stockPill(p)}</button>`;
  return r.exactos.slice(0, 8).map(row).join("") + (r.parecidos.length ? `<div class="small muted" style="padding-top:8px;font-weight:600">Parecidos</div>` + r.parecidos.slice(0, 5).map(row).join("") : "")
    || `<div class="empty">Sin resultados para “${esc(q.trim())}”.</div>`;
}

// ---------- Reservas (vista previa) ----------
// Los panes que se pueden reservar son los productos del sector Pan marcados así en Tipos de pan
const panesReserva = () => S.products.filter(p => p.cat === "Pan" && disp(p) && p.reserva !== false).sort((a, b) => a.name.localeCompare(b.name, "es"));
function resCutoff(){ const d = new Date(); d.setHours(RES_CUT_HOUR,0,0,0); if (d.getTime() > Date.now()) d.setDate(d.getDate()-1); return d.getTime(); }
// Las reservas viejas se sacan de la vista y de este dispositivo (sin enviarlo como cambio)
// Las reservas para otro día (las de internet) se guardan hasta ese día
const resVigente = (r, cut = resCutoff()) => r.para ? r.para >= ymd() : r.at >= cut;
const resDia = r => r.para || ymd(r.at);
const webNuevas = () => S.reservas.filter(r => r.origen === "web" && r.estado === "nueva" && !r.done);
function purgeReservas(){ const cut = resCutoff(), old = S.reservas.filter(r => !r.at || !resVigente(r, cut)); if (!old.length) return;
  S.reservas = S.reservas.filter(r => r.at && resVigente(r, cut)); LocalDB.apply(old.map(r => ({ store:"reservas", del:r.id, local:true }))).catch(() => {}); }
const resDetail = q => panesReserva().filter(p => q[p.id] > 0).map(p => `${fq(p, q[p.id])} ${p.name.toLowerCase()}`).join(", ");
const RES_ESTADO = { nueva:["warn","Nueva"], confirmada:["ok","Confirmada"], rechazada:["bad","Rechazada"] };
function resPill(r){ if (r.done) return `<span class="pill ok">Entregado</span>`; const e = r.origen === "web" && RES_ESTADO[r.estado]; return e ? `<span class="pill ${e[0]}">${e[1]}</span>` : `<span class="pill warn">Pendiente</span>`; }
function viewReservas(){
  const rs = S.reservas.slice().sort((a,b) => resDia(a).localeCompare(resDia(b)) || (a.at||0) - (b.at||0));

// Una reserva hecha desde la página de la tienda: confirmar, rechazar, avisar y bloquear
function openReservaWeb(r){

  const msg = r.estado === "rechazada" ? `Hola ${r.name}, te escribimos de ${tienda}. Lo sentimos, no podemos atender tu reserva de ${r.detail} para ${dia}.`
    : `Hola ${r.name}, te escribimos de ${tienda}. Tu reserva de ${r.detail} para ${dia}${r.hora ? " (" + r.hora + ")" : ""} está confirmada. ¡Te esperamos!`;
  const bloqueado = (pub().bloqueados || []).includes(r.tel);
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(r.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="row">${resPill(r)}<span class="small muted">Por internet · reservó ${esc(ago(r.at))}</span></div>
    <div class="card stack" style="gap:6px"><div style="font-weight:600">${esc(r.detail)}</div>
      <div class="small muted">Para ${esc(dia)}${resDia(r) === ymd() ? "" : " · " + esc(fdate(resDia(r)))}${r.hora ? " · " + esc(r.hora) : ""}</div>
      ${r.nota ? `<div class="small">“${esc(r.nota)}”</div>` : ""}
      <div class="small muted">Celular: +${esc(r.tel)}</div></div>

      : r.estado === "nueva" ? `<div class="grid2"><button class="btn primary" id="rwok">Confirmar</button><button class="btn" id="rwno" style="color:var(--bad)">Rechazar</button></div>`
      : `${r.estado === "confirmada" ? `<button class="btn primary block" id="rwdone">Marcar como entregada</button>` : ""}
         <a class="btn block" style="text-align:center" href="${esc(waLink(r.tel, msg))}" ${WA_TARGET}>Avisarle por WhatsApp</a>${waWebNote("rwweb", r.tel, msg)}`}
    ${!puede("config") ? "" : bloqueado ? `<button class="btn ghost block" id="rwunblock">Desbloquear este número</button>` : `<button class="btn ghost block" id="rwblock">Bloquear este número</button>`}
    <p class="small muted" style="margin:0" data-perm="config">Un número bloqueado ya no puede reservar desde la página. Úsalo si alguien reserva y no viene, o manda reservas falsas.</p>
  </div>`);
  const set = cambios => run(async () => { await act.put("reservas", [Object.assign({}, r, cambios)]); render(); openReservaWeb(S.reservas.find(x => x.id === r.id)); });
  const b = id => $(id) || {};
  b("#rwok").onclick = () => set({ estado:"confirmada" });
  b("#rwno").onclick = () => set({ estado:"rechazada" });
  b("#rwdone").onclick = () => run(async () => { await act.reserva(r, true); closeModal(); render(); toast(`Reserva de ${r.name} entregada`); });
  b("#rwundo").onclick = () => set({ done:false });
  b("#rwblock").onclick = () => run(async () => { await setPub({ bloqueados:[...(pub().bloqueados || []), r.tel] }); if (r.estado === "nueva") await act.put("reservas", [Object.assign({}, r, { estado:"rechazada" })]);
    toast("Número bloqueado"); render(); openReservaWeb(S.reservas.find(x => x.id === r.id)); });
  b("#rwunblock").onclick = () => run(async () => { await setPub({ bloqueados:(pub().bloqueados || []).filter(t => t !== r.tel) }); toast("Número desbloqueado"); openReservaWeb(r); });
}

// ajustes.publico: { pid, activo, url, mostrar:"todo"|"pan", stock, reservas, reservar:"pan"|"todo", diasMax, maxDia,
//   mensaje, direccion, horario, whatsapp, bloqueados }. El pid es distinto al código de la tienda: el link público
// nunca da acceso a los datos. Cualquier dispositivo conectado al servidor publica la vitrina cuando algo cambia.
const pub = () => S.ajustes.publico || {};
const nuevoPid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
async function setPub(cambios){ await act.setting("publico", Object.assign({}, pub(), cambios)); vit.last = ""; vitrinaSoon(300); }
const esHttps = u => /^https:\/\//.test(u || "");
// Dirección que abren los clientes: la de internet si está anotada, o la de este servidor
const pubBase = () => (pub().url || (location.protocol === "https:" && sameOrigin ? location.origin : "") || meta.servidor || "").replace(/\/+$/, "");
const pubLink = () => pubBase() && pub().pid ? `${pubBase()}/tienda.html?t=${pub().pid}` : "";
const telCL = t => { let d = String(t || "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; if (d.length === 8) d = "569" + d; return /^569\d{8}$/.test(d) ? d : ""; };
function vitrina(){
  const o = pub(), pan = new Set(panesReserva().map(p => p.id));
  const reservable = p => !!o.reservas && (o.reservar === "todo" || pan.has(p.id));
  const estado = p => { const s = stockOf(p); return s == null ? undefined : s <= 0 ? "no" : s <= p.min ? "poco" : "hay"; };
  const productos = S.products.filter(p => disp(p) && (o.mostrar !== "pan" || p.cat === "Pan") && (p.price > 0 || reservable(p)))
    .sort((a, b) => sectores().indexOf(a.cat) - sectores().indexOf(b.cat) || a.name.localeCompare(b.name, "es"))
    .map(p => Object.assign({ id:p.id, n:p.name, c:p.cat, p:p.price }, p.kg ? { kg:1 } : {}, reservable(p) ? { r:1 } : {}, o.stock ? { s:estado(p) } : {}));
  return { data:{ v:1, nombre:S.ajustes.tienda_nombre || "", mensaje:o.mensaje || "", direccion:o.direccion || "", horario:o.horario || "", whatsapp:telCL(o.whatsapp),
      color:getComputedStyle(document.documentElement).getPropertyValue("--brand").trim(), reservas:!!o.reservas, stock:!!o.stock, diasMax:o.diasMax ?? 1, productos },
    privado:{ bloqueados:o.bloqueados || [], maxDia:o.maxDia || 40 }, activo:ext("pagina") && !!o.activo };
}
const vit = { last:"", timer:null, due:0, at:0, error:"" };
const vitEstado = () => !meta.servidor ? "" : vit.error ? `No se pudo publicar: ${vit.error}. Se reintenta solo.` : vit.at ? `✓ Publicada ${ago(vit.at)}` : pub().activo ? "Publicando…" : "";
function vitrinaSoon(ms = 6000){
  if (!S || meta.demo || !meta.servidor || !pub().pid) return;
  // Si ya hay una publicación pendiente que sale antes, se deja esa
  if (vit.timer && vit.due <= Date.now() + ms) return;
  clearTimeout(vit.timer); vit.due = Date.now() + ms; vit.timer = setTimeout(() => { vit.timer = null; publicar(); }, ms);
}
async function publicar(){
  // Solo publica un dispositivo al día con el servidor, para no subir una vitrina vieja
  if (Sync.state.status !== "ok"){ vitrinaSoon(Sync.state.status === "syncing" ? 1500 : 15e3); return; }
  const v = vitrina(), key = JSON.stringify(v);
  if (key === vit.last) return;
  try {
    const r = await fetch(meta.servidor.replace(/\/+$/, "") + "/api/publico/publicar", { method:"POST", headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ tienda:meta.tienda.id, pid:pub().pid, activo:v.activo, data:Object.assign({ publicado:Date.now() }, v.data), privado:v.privado }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || `El servidor respondió ${r.status}`);
    vit.last = key; vit.at = Date.now(); vit.error = "";
  } catch(e){ vit.error = e.message || "Sin conexión con el servidor"; vitrinaSoon(60e3); }
  const el = $("#pgest"); if (el) el.textContent = vitEstado();
}
// Aviso cuando llega una reserva nueva por internet
let resVistas = null;
function avisarReservas(){
  const ids = webNuevas().map(r => r.id);
  if (!resVistas){ resVistas = new Set(ids); return; }
  const nuevas = webNuevas().filter(r => !resVistas.has(r.id)); ids.forEach(id => resVistas.add(id));
  if (!nuevas.length || !ext("pagina")) return;
  toast(nuevas.length === 1 ? `Nueva reserva por internet: ${nuevas[0].name}` : `${nuevas.length} reservas nuevas por internet`);
  try { navigator.vibrate?.(200); const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.18); } catch(e){}
}
// El generador de códigos QR (qr.js) se carga recién cuando se necesita
let qrLib = null;
const cargarQR = () => qrLib || (qrLib = new Promise((ok, no) => { if (window.qrcode) return ok(window.qrcode); const sc = document.createElement("script"); sc.src = "qr.js"; sc.onload = () => ok(window.qrcode); sc.onerror = () => { qrLib = null; no(new Error("No se pudo cargar el generador del código QR")); }; document.head.append(sc); }));
async function qrSvg(texto, px = 4){ const q = (await cargarQR())(0, "M"); q.addData(texto); q.make(); return q.createSvgTag({ cellSize:px, margin:4, scalable:true }); }

// ---------- Utilidades de las extensiones ----------
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const r3 = n => Math.round(n * 1000) / 1000;
// Cantidad con su unidad: los productos a granel van en kilos
const fq = (p, q) => (+r3(q || 0)).toLocaleString("es-CL", { maximumFractionDigits:3 }) + (p?.kg ? " kg" : "");
const ymd = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const daysTo = f => Math.round((new Date(f + "T12:00") - new Date(ymd() + "T12:00")) / D);
const fdate = f => new Date(f + "T12:00").toLocaleDateString("es-CL", { weekday:"short", day:"numeric", month:"short" });
const enDias = n => n < -1 ? `hace ${-n} días` : n === -1 ? "ayer" : n === 0 ? "hoy" : n === 1 ? "mañana" : `en ${n} días`;

    if (hoyE.length) card("encargos", "Encargos para hoy", `<span class="pill warn">${hoyE.length}</span>`, hoyE.slice(0, 3).map(e => esc(e.cliente)).join(", ") + (hoyE.length > 3 ? "…" : ""));

    const vs = S.vencimientos.filter(v => !v.done && P(v.pid) && daysTo(v.fecha) <= 7), venc = vs.filter(v => daysTo(v.fecha) < 0).length;
    if (vs.length) card("vencimientos", "Vencen pronto", `<span class="pill ${venc ? "bad" : "warn"}">${venc ? venc + " vencidos" : vs.length}</span>`, "En los próximos 7 días: " + [...new Set(vs.map(v => P(v.pid).name))].slice(0, 3).map(esc).join(", "));

// ---------- Ofertas y packs ----------
function ofertaVigente(o, t = new Date()){
  if (o.activa === false) return false;
  if (o.dias?.length && !o.dias.includes(t.getDay())) return false;
  if (o.desde && o.hasta){ const hm = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
    if (o.desde <= o.hasta ? (hm < o.desde || hm >= o.hasta) : (hm < o.desde && hm >= o.hasta)) return false; }
  return true;
}
// Calcula el total de la venta con las ofertas que corresponden en este momento.
// Primero los packs ("3 por $1.000", se pueden mezclar los productos elegidos) y después
// los descuentos en %, solo en lo que no entró en un pack.
function pricing(cart){
  const lines = cart.map(l => { const p = P(l.pid); return { pid:l.pid, qty:l.qty, unit:p.price, bruto:Math.round(l.qty * p.price), desc:0 }; });
  const aplicadas = [], avisos = [];
  if (ext("ofertas")){
    const vig = S.ofertas.filter(o => ofertaVigente(o));
    for (const o of vig.filter(o => o.tipo === "pack" && o.n >= 2 && o.precio > 0 && o.pids?.length)){
      const units = [];
      lines.filter(x => !P(x.pid).kg && o.pids.includes(x.pid)).forEach(x => { for (let i = 0; i < x.qty; i++) units.push(x); });
      units.sort((a, b) => b.unit - a.unit);
      let ahorro = 0;
      for (let i = 0; i + o.n <= units.length; i += o.n){
        const g = units.slice(i, i + o.n), sum = g.reduce((a, x) => a + x.unit, 0), save = sum - o.precio;
        if (save <= 0) continue;
        g.forEach(x => x.desc += save * x.unit / sum); ahorro += save;
      }
      if (ahorro > 0) aplicadas.push({ nombre:o.nombre, ahorro:Math.round(ahorro) });
      const resto = units.length % o.n;
      if (resto) avisos.push(`Lleva ${o.n - resto} más para completar "${o.nombre}" (${o.n} por ${clp(o.precio)}).`);
    }
    const enPack = new Set(lines.filter(x => x.desc > 0));
    for (const o of vig.filter(o => o.tipo === "descuento" && o.pct > 0)){
      let ahorro = 0;
      lines.filter(x => !enPack.has(x) && x.desc === 0 && (!o.pids?.length || o.pids.includes(x.pid))).forEach(x => { x.desc = x.bruto * Math.min(100, o.pct) / 100; ahorro += x.desc; });
      if (ahorro > 0) aplicadas.push({ nombre:o.nombre, ahorro:Math.round(ahorro) });
    }
  }
  lines.forEach(x => x.desc = Math.min(x.bruto, Math.round(x.desc)));
  const subtotal = lines.reduce((a, x) => a + x.bruto, 0), descuento = lines.reduce((a, x) => a + x.desc, 0);
  return { lines, subtotal, descuento, total:subtotal - descuento, aplicadas, avisos };
}
function ofertaDesc(o){
  const prods = (o.pids || []).map(id => P(id)?.name).filter(Boolean);
  const que = o.tipo === "pack" ? `${o.n} por ${clp(o.precio)}` : `${o.pct}% de descuento`;
  const en = prods.length ? (prods.length > 3 ? prods.slice(0, 3).join(", ") + ` y ${prods.length - 3} más` : prods.join(", ")) : "todos los productos";
  const cuando = [o.dias?.length ? diasTxt(o.dias) : "", o.desde && o.hasta ? `${o.desde} a ${o.hasta}` : ""].filter(Boolean).join(" · ");
  return `${que} · ${en}${cuando ? " · " + cuando : ""}`;
}

const ventaGrupo = g => S.movs.filter(m => m.type === "venta" && (m.grupo || m.id) === g);
function comprobanteTexto(g){
  const ms = ventaGrupo(g); if (!ms.length) return "";
  const tot = ms.reduce((a, m) => a + m.qty * m.price, 0), desc = ms.reduce((a, m) => a + (m.desc || 0), 0);
  const lines = ms.map(m => { const p = P(m.pid); return `${fq(p, m.qty)} x ${p?.name || "Producto"}  ${clp(m.qty * (m.lista ?? m.price))}`; });
  return [`*${S.ajustes.tienda_nombre || "Mi Almacén"}*`, new Date(ms[0].at).toLocaleString("es-CL", { dateStyle:"short", timeStyle:"short" }), "",
    ...lines, ...(desc ? [`Descuentos  −${clp(desc)}`] : []), "", `*Total: ${clp(tot)}*`,
    ...(ms[0].pago ? [`Pago: ${PAGOS[ms[0].pago]}`] : []), ...(ms[0].quien && nombrePersona(ms[0].quien) ? [`Atendió: ${nombrePersona(ms[0].quien)}`] : []),
    "", "¡Gracias por su compra!", "Comprobante sin valor tributario"].join("\n");
}

// ---------- Cierre de caja ----------
// Se cuenta desde el último cierre (si fue en las últimas 20 horas) o desde que empezó el día
function cajaDesde(){ const last = S.cajas.reduce((a, c) => Math.max(a, c.at), 0), d0 = new Date().setHours(0,0,0,0); return last > Date.now() - 20*H ? last : d0; }
function cajaEsperado(desde){
  const e = { efectivo:0, debito:0, transferencia:0 }, ventas = new Set();
  S.movs.filter(m => m.type === "venta" && m.at >= desde).forEach(m => { e[PAGOS[m.pago] ? m.pago : "efectivo"] += m.qty * (m.price ?? P(m.pid)?.price ?? 0); ventas.add(m.grupo || m.id); });
  const abonos = S.clients.flatMap(c => c.items).filter(i => i.type === "abono" && i.at >= desde).reduce((a, i) => a + i.amount, 0);
  Object.keys(e).forEach(k => e[k] = Math.round(e[k]));
  return { e, abonos, ventas:ventas.size, vendido:e.efectivo + e.debito + e.transferencia };
}
const cajaDif = k => Object.keys(PAGOS).reduce((a, m) => a + (k.contado[m] == null ? 0 : k.contado[m] - k.esperado[m]), 0);
const difPill = d => d === 0 ? `<span class="pill ok">Cuadra</span>` : d < 0 ? `<span class="pill bad">Faltan ${clp(-d)}</span>` : `<span class="pill warn">Sobran ${clp(d)}</span>`;
function cajaCalculo(){
  const desde = cajaDesde(), x = cajaEsperado(desde), c = ui.caja;
  const fondo = Math.round(+c.fondo || 0), gastos = Math.round(+c.gastos || 0);
  const esperado = { efectivo:fondo + x.e.efectivo + x.abonos - gastos, debito:x.e.debito, transferencia:x.e.transferencia };
  const val = v => v === "" || v == null ? null : Math.round(+v || 0);
  const contado = { efectivo:val(c.efectivo), debito:val(c.debito), transferencia:val(c.transferencia) };
  return { desde, x, fondo, gastos, esperado, contado };
}

        ${x.abonos ? `<div class="item"><div class="main"><div class="name">Pagos de fiados</div><div class="sub">Se cuentan como efectivo</div></div><div style="font-weight:700">${clp(x.abonos)}</div></div>` : ""}</div></div>

      <div class="grid2" style="align-items:end">${inp("ke", "efectivo", "Efectivo que hay en la caja")}${inp("kd", "debito", "Total de la máquina de tarjetas")}</div>

  </div>`;
}
function cajaRes(){
  const { esperado, contado } = cajaCalculo();
  const rows = Object.entries(PAGOS).filter(([k]) => contado[k] != null).map(([k, v]) => `<div class="item"><div class="main"><div class="name">${v}</div><div class="sub">Debería haber ${clp(esperado[k])} · hay ${clp(contado[k])}</div></div>${difPill(contado[k] - esperado[k])}</div>`);

// ---------- Stock bajo y lista de compras ----------
const sugerido = (p, s) => { const q = Math.max(1, p.min * 2 - Math.max(0, s ?? 0)); return p.kg ? r3(q) : Math.ceil(q); };
const provDe = p => ext("proveedores") ? S.proveedores.find(x => x.id === p.prov) : null;
function comprasGrupos(){
  const c = ui.compras;
  const sug = S.products.filter(p => disp(p) && !c.quitar[p.id]).map(p => [p, stockOf(p)]).filter(([p, s]) => s != null && s <= p.min);
  const ids = new Set(sug.map(([p]) => p.id));
  const extra = Object.keys(c.extra).filter(id => !ids.has(id) && P(id)).map(id => [P(id), stockOf(P(id))]);
  const groups = {};
  [...sug, ...extra].sort((a, b) => a[0].name.localeCompare(b[0].name, "es")).forEach(([p, s]) => { const pr = provDe(p), k = pr?.id || "";
    (groups[k] ||= { k, pr, items:[] }).items.push({ p, s, qty:c.qty[p.id] ?? c.extra[p.id] ?? sugerido(p, s) }); });
  return Object.values(groups).sort((a, b) => (a.pr ? a.pr.nombre : "~").localeCompare(b.pr ? b.pr.nombre : "~", "es"));
}
const pedidoTexto = g => `Hola${g.pr ? " " + g.pr.nombre : ""}, te escribo de ${S.ajustes.tienda_nombre || "el almacén"}. Quiero pedir:\n` + g.items.filter(l => l.qty > 0).map(l => `- ${fq(l.p, l.qty)} ${l.p.name}`).join("\n") + "\n¡Gracias!";

}
function bindCompras(app){
  const c = ui.compras;

}

// ---------- Resumen de ventas ----------
const PERIODOS = { hoy:"Hoy", d7:"7 días", mes:"Este mes", mesp:"Mes pasado", anio:"Este año", aniop:"Año pasado" };
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function rango(k){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth(), d0 = new Date(y, m, n.getDate()).getTime();
  return { hoy:[d0, Infinity], d7:[d0 - 6*D, Infinity], mes:[new Date(y, m, 1).getTime(), Infinity], mesp:[new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()],
    anio:[new Date(y, 0, 1).getTime(), Infinity], aniop:[new Date(y - 1, 0, 1).getTime(), new Date(y, 0, 1).getTime()] }[k];
}
function resumen(k){
  const [a, b] = rango(k), ms = S.movs.filter(m => m.type === "venta" && m.at >= a && m.at < b);
  const grupos = new Set(ms.map(m => m.grupo || m.id)), total = ms.reduce((t, m) => t + m.qty * m.price, 0);
  let gan = 0, sinCosto = new Set();
  ms.forEach(m => { const p = P(m.pid); if (p?.cost > 0) gan += m.qty * (m.price - p.cost); else sinCosto.add(m.pid); });
  const pago = {}; ms.forEach(m => { const k2 = m.pago || "sin"; pago[k2] = (pago[k2] || 0) + m.qty * m.price; });
  const porMes = k === "anio" || k === "aniop", tramos = {};
  ms.forEach(m => { const d = new Date(m.at), key = porMes ? d.getMonth() : ymd(m.at); tramos[key] = (tramos[key] || 0) + m.qty * m.price; });
  const prods = {}; ms.forEach(m => { const x = (prods[m.pid] ||= { q:0, t:0 }); x.q += m.qty; x.t += m.qty * m.price; });
  return { ms, ventas:grupos.size, total, gan, sinCosto:sinCosto.size, pago, porMes, tramos, top:Object.entries(prods).filter(([id]) => P(id)).sort((x, y) => y[1].t - x[1].t).slice(0, 10) };
}
function viewResumen(){
  const k = ui.resPer || (ui.resPer = "hoy"), r = resumen(k);
  const keys = r.porMes ? Object.keys(r.tramos).map(Number).sort((x, y) => x - y) : Object.keys(r.tramos).sort();
  const max = Math.max(1, ...Object.values(r.tramos)), maxPago = Math.max(1, ...Object.values(r.pago));
  const bar = (lbl, v, mx) => `<div class="barra"><span class="muted">${lbl}</span><i style="width:${Math.max(1, v / mx * 100)}%"></i><b>${clp(v)}</b></div>`;
  return `${header("Resumen de ventas", PERIODOS[k])}
  <div class="stack">
    <div class="chips">${Object.entries(PERIODOS).map(([key, v]) => `<button class="chip" data-per="${key}" aria-pressed="${key === k}">${v}</button>`).join("")}</div>
    <div class="kpis">
      <div class="card kpi"><div class="num">${clp(r.total)}</div><div class="lbl">vendido · ${r.ventas} ${r.ventas === 1 ? "venta" : "ventas"}</div></div>
      <div class="card kpi" data-perm="costos"><div class="num">${clp(r.gan)}</div><div class="lbl">ganancia estimada</div></div>
      <div class="card kpi"><div class="num">${clp(r.ventas ? r.total / r.ventas : 0)}</div><div class="lbl">promedio por venta</div></div>
      <div class="card kpi"><div class="num">${r.top.length ? esc(fq(P(r.top[0][0]), r.top[0][1].q)) : "—"}</div><div class="lbl">${r.top.length ? esc(P(r.top[0][0]).name) : "lo más vendido"}</div></div>
    </div>
    ${r.sinCosto ? `<p class="small muted" style="margin:0">La ganancia usa el costo actual de cada producto. ${r.sinCosto} ${r.sinCosto === 1 ? "producto vendido no tiene" : "productos vendidos no tienen"} costo y no ${r.sinCosto === 1 ? "entra" : "entran"} en la cuenta.</p>` : ""}
    ${r.ms.length ? `
    ${Object.keys(r.pago).some(x => x !== "sin") ? `<div class="card"><h3>Por medio de pago</h3>${Object.entries(r.pago).sort((x, y) => y[1] - x[1]).map(([x, v]) => bar(x === "sin" ? "Sin anotar" : PAGOS_CORTO[x], v, maxPago)).join("")}</div>` : ""}
    ${keys.length > 1 ? `<div class="card"><h3>${r.porMes ? "Por mes" : "Por día"}</h3>${keys.map(x => bar(r.porMes ? MESES[x] : new Date(x + "T12:00").toLocaleDateString("es-CL", { weekday:"short", day:"numeric" }), r.tramos[x], max)).join("")}</div>` : ""}
    <div class="card"><h3>Lo más vendido</h3><div class="list">${r.top.map(([id, x]) => `<div class="item"><div class="main"><div class="name">${esc(P(id).name)}</div><div class="sub">${fq(P(id), x.q)}${P(id).kg ? "" : x.q === 1 ? " vendido" : " vendidos"}</div></div><b>${clp(x.t)}</b></div>`).join("")}</div></div>
    <button class="btn block" id="xlsx">Descargar en Excel</button>` : `<div class="card empty">No hay ventas en este período.</div>`}
  </div>`;
}

function descargarExcel(){

  const res = [[nombre + " · Resumen de ventas"], ["Período", PERIODOS[k]], ["Descargado", new Date().toLocaleString("es-CL")], [],
    ["Total vendido", Math.round(r.total)], ["Ventas", r.ventas], ["Promedio por venta", Math.round(r.ventas ? r.total / r.ventas : 0)], ["Ganancia estimada", Math.round(r.gan)], [],
    ["Medio de pago", "Total"], ...Object.entries(r.pago).map(([x, v]) => [x === "sin" ? "Sin anotar" : PAGOS[x], Math.round(v)]), [],
    ["Producto", "Cantidad", "Total"], ...r.top.map(([id, x]) => [P(id).name, r3(x.q), Math.round(x.t)])];
  const ventas = [["Fecha", "Hora", "Producto", "Sector", "Cantidad", "Precio", "Descuento", "Total", "Medio de pago", "Atendió"],
    ...r.ms.slice().sort((a, b) => a.at - b.at).map(m => { const p = P(m.pid), d = new Date(m.at);
      return [d.toLocaleDateString("es-CL"), d.toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" }), p?.name || "", p?.cat || "", r3(m.qty), Math.round(m.lista ?? m.price), Math.round(m.desc || 0), Math.round(m.qty * m.price), m.pago ? PAGOS[m.pago] : "", nombrePersona(m.quien)]; })];

// Archivo .xlsx armado a mano (un .zip sin comprimir con hojas en XML), sin librerías
function xlsx(sheets){
  const xe = v => String(v).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "");
  const col = i => { let s = ""; i++; while (i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const sheet = rows => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r, i) => `<row r="${i + 1}">${r.map((v, j) => {
    const ref = col(j) + (i + 1); if (v === "" || v == null) return ""; return typeof v === "number" && isFinite(v) ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`; }).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const files = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xe(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>`],
    ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheet(s.rows)])

  return zipStore(files);
}
// .zip sin compresión (método "store")
function zipStore(files){
  const enc = new TextEncoder(), crcT = zipStore.t || (zipStore.t = Array.from({ length:256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; }));
  const crc = b => { let c = 0xFFFFFFFF; for (const x of b) c = crcT[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = []; let off = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255], u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  for (const [name, text] of files){
    const nb = enc.encode(name), data = enc.encode(text), c = crc(data);
    const head = [...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)];
    parts.push(new Uint8Array(head), nb, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += head.length + nb.length + data.length;
  }
  const csize = central.reduce((t, x) => t + x.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...central, end], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function tour(i){
  document.querySelectorAll(".tour-hole,.tour-card").forEach(x => x.remove());
  const steps = TOUR.filter(t => !t.ext || ext(t.ext));
  if (i >= steps.length){ go("inicio"); return; }
  const t = steps[i];
  if (ui.view !== t.view) go(t.view);
  const el = document.querySelector(t.sel);
  if (el) el.scrollIntoView({ block:"center" });
  setTimeout(() => {
    const r = el?.getBoundingClientRect(), hole = document.createElement("div"), card = document.createElement("div");
    hole.className = "tour-hole";
    if (r) Object.assign(hole.style, { left:r.left - 6 + "px", top:r.top - 6 + "px", width:r.width + 12 + "px", height:r.height + 12 + "px" });
    else Object.assign(hole.style, { left:"50%", top:"40%", width:"0", height:"0" });
    card.className = "tour-card";
    card.innerHTML = `<div class="small muted" style="font-weight:600">Paso ${i + 1} de ${steps.length}</div><p style="margin:6px 0 12px">${esc(t.txt)}</p>
      <div class="spread"><button class="btn sm ghost" data-tx>Salir</button><button class="btn sm primary" data-tn>${i + 1 < steps.length ? "Siguiente" : "Terminar"}</button></div>`;
    const below = !r || r.bottom < innerHeight * 0.55;
    card.style[below ? "top" : "bottom"] = below ? (r ? r.bottom + 18 : innerHeight * 0.45) + "px" : innerHeight - r.top + 18 + "px";
    document.body.append(hole, card);
    card.querySelector("[data-tx]").onclick = () => { hole.remove(); card.remove(); };
    card.querySelector("[data-tn]").onclick = () => tour(i + 1);
  }, 120);
}

async function downloadBackup(){
  const file = await LocalDB.exportAll();
  const url = URL.createObjectURL(new Blob([JSON.stringify(file)], { type:"application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `respaldo-${(S.ajustes.tienda_nombre || "tienda").toLowerCase().replace(/[^a-z0-9ñáéíóú]+/g, "-")}-${hoy()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`Respaldo descargado: ${file.tablas.movs.length} movimientos`);
}
async function restoreBackup(input){
  const f = input.files?.[0]; input.value = ""; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch(e){ throw new Error("No se pudo leer el archivo"); }
  if (data?.app !== "mi-almacen") throw new Error("El archivo no es un respaldo de esta app");
  const tienda = (data.tablas.meta || []).find(m => m.key === "tienda")?.value?.nombre || "la tienda";
  if (MODE){
    const otra = (data.tablas.meta || []).find(m => m.key === "tienda")?.value?.id !== meta.tienda?.id;
    openModal(`<div class="stack"><h2>Restaurar el respaldo</h2>
      <p style="margin:0">Respaldo de <b>${esc(tienda)}</b> del ${esc(new Date(data.creado).toLocaleString("es-CL"))}.</p>
      ${otra ? `<p class="pill warn" style="white-space:normal;margin:0;padding:8px 10px">Este respaldo es de otra tienda. Si agregas sus datos, quedan mezclados con los de esta.</p>` : ""}
      <button class="btn primary block" id="domerge">Agregar lo que falta</button>
      <p class="small muted" style="margin:0">Suma los productos, ventas, fiados y demás que no estén aquí. No borra ni cambia nada de lo que ya tienes.</p>
      <button class="btn block" id="doreplace">Reemplazar todo</button>
      <p class="small muted" style="margin:0">Borra lo de este dispositivo y deja exactamente lo del respaldo.</p>
    </div>`);
    $("#domerge").onclick = () => run(async () => { const faltan = await LocalDB.missing(data); faltan.forEach(o => o.local = meta.demo);
      await commit(faltan); closeModal(); await openStore(); toast(faltan.length ? `Se agregaron ${faltan.length} registros` : "No faltaba nada"); });
    $("#doreplace").onclick = () => run(async () => { await LocalDB.importAll(data); closeModal(); await openStore(); toast("Respaldo restaurado"); });
    return;
  }
  openModal(`<div class="stack"><h2>¿Restaurar el respaldo?</h2>
    <p style="margin:0">Se reemplaza todo lo de este dispositivo por el respaldo de <b>${esc(tienda)}</b> del ${esc(new Date(data.creado).toLocaleString("es-CL"))}: ${(data.tablas.products || []).length} productos y ${(data.tablas.movs || []).length} movimientos.</p>
    <div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="dorestore">Restaurar</button></div></div>`);
  $("#dorestore").onclick = () => run(async () => { await LocalDB.importAll(data); closeModal(); await openStore(); toast("Respaldo restaurado"); });
}

// ---------- Cuentas y permisos (Fase 4) ----------
// Con las cuentas activas (ajustes.cuentas), cada dispositivo entra con un usuario. meta.cuenta guarda la sesión
// de este dispositivo: { token, usuario:{ id, usuario, nombre }, tiendas:[{ tienda, nombre, rol, permisos }] }.
// El servidor revisa cada cambio contra los permisos; la app además esconde lo que no se puede usar.
const cuentasOn = () => !!S?.ajustes?.cuentas;
const miTienda = () => meta.cuenta?.tiendas?.find(t => t.tienda === meta.tienda?.id) || null;
const puede = k => !cuentasOn() || !!miTienda()?.permisos?.[k];
const necesitaEntrar = () => !meta.demo && !!meta.tienda && (cuentasOn() || Sync.state.status === "cuenta") && (!miTienda() || Sync.state.status === "cuenta");
const ROLES = { dueno:"Dueño", encargado:"Encargado", vendedor:"Vendedor" };
const PERMISOS = { precios:"Cambiar productos, precios y ofertas", costos:"Ver costos, ganancias y proveedores", inventario:"Contar, recibir mercadería y vencimientos", reportes:"Ver el resumen de ventas y el historial", config:"Cambiar ajustes, extensiones, apariencia y la página" };
async function cuentaApi(base, path, body, token){
  const h = { "Content-Type":"application/json" }; if (token) h.Authorization = token;
  let r; try { r = await fetch(base.replace(/\/+$/, "") + path, body ? { method:"POST", headers:h, body:JSON.stringify(body) } : { headers:h, cache:"no-store" }); }
  catch(e){ throw new Error("No hay conexión con el servidor. Para esto se necesita estar conectado."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || `El servidor respondió ${r.status}`), { status:r.status });
  return j;
}
const api = (path, body) => cuentaApi(meta.servidor, path, body, meta.cuenta?.token);
const entrar = (base, usuario, password) => cuentaApi(base, "/api/cuentas/entrar", { usuario, password });
async function guardarCuenta(c){ meta.cuenta = c; await LocalDB.setMeta("cuenta", c); Sync.state.token = c?.token || ""; }
// Renueva la sesión y los permisos cuando hay conexión
async function refrescarCuenta(){
  if (!meta.cuenta?.token || !meta.servidor) return;
  try { await guardarCuenta(await api("/api/cuentas/yo")); if (MODE && !document.querySelector(".overlay")) softRender(); } catch(e){}
}
